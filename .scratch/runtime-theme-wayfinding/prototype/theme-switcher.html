<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme switcher prototype</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d1d1f; background: #eef1f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button { font: inherit; }
    .window { min-height: 100vh; padding: 42px 20px 100px; }
    .settings { display: grid; grid-template-columns: 210px minmax(0, 760px); gap: 18px; max-width: 1040px; margin: 0 auto; }
    .sidebar, .panel { border: 1px solid rgba(65, 75, 90, .15); background: rgba(255,255,255,.72); box-shadow: 0 16px 40px rgba(34, 42, 55, .12); backdrop-filter: blur(18px); }
    .sidebar { min-height: 530px; padding: 18px 10px; border-radius: 18px; }
    .brand { padding: 5px 10px 22px; color: #596273; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
    .nav-item { display: flex; width: 100%; border: 0; border-radius: 9px; padding: 10px; background: transparent; color: #596273; text-align: left; cursor: pointer; }
    .nav-item.active { background: #1473e6; color: white; font-weight: 650; }
    .panel { min-width: 0; padding: 42px clamp(22px, 5vw, 64px); border-radius: 20px; }
    .eyebrow { margin: 0 0 8px; color: #697386; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 25px; line-height: 1.15; }
    .intro { max-width: 620px; margin: 10px 0 28px; color: #657084; line-height: 1.55; }
    .section { margin-top: 24px; }
    .section h2 { margin: 0 0 10px; font-size: 14px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; min-height: 66px; border-top: 1px solid rgba(65,75,90,.14); }
    .row:first-child { border-top: 0; }
    .row strong { display: block; font-size: 14px; }
    .row small { display: block; margin-top: 4px; color: #697386; line-height: 1.4; }
    .segmented { display: inline-flex; gap: 3px; border: 1px solid rgba(65,75,90,.18); border-radius: 9px; padding: 3px; background: rgba(80,90,110,.08); }
    .segmented button { border: 0; border-radius: 6px; padding: 7px 10px; background: transparent; color: #586274; cursor: pointer; }
    .segmented button[aria-checked="true"] { background: white; color: #1d1d1f; box-shadow: 0 1px 4px rgba(20,30,40,.16); font-weight: 650; }
    .theme-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .theme-card { position: relative; min-width: 0; border: 1px solid rgba(65,75,90,.18); border-radius: 14px; padding: 10px; background: rgba(255,255,255,.6); text-align: left; cursor: pointer; }
    .theme-card[aria-checked="true"] { border: 2px solid #1473e6; padding: 9px; box-shadow: 0 0 0 3px rgba(20,115,230,.14); }
    .theme-card h3 { margin: 10px 0 3px; font-size: 14px; }
    .theme-card p { min-height: 40px; margin: 0; color: #697386; font-size: 12px; line-height: 1.35; }
    .mini { height: 82px; overflow: hidden; border: 1px solid rgba(20,25,35,.18); padding: 9px; }
    .mini .mini-bar { height: 7px; width: 55%; margin-bottom: 9px; }
    .mini .mini-line { height: 5px; width: 78%; margin: 6px 0; opacity: .72; }
    .mini .mini-button { width: 45%; height: 18px; margin-top: 9px; }
    .mini-liquid { border-radius: 10px; background: linear-gradient(135deg, #eef5ff, #d8e0ef); box-shadow: inset 0 1px rgba(255,255,255,.9); }
    .mini-liquid .mini-bar, .mini-liquid .mini-button { border-radius: 6px; background: #1473e6; }
    .mini-liquid .mini-line { border-radius: 3px; background: #6c7890; }
    .mini-fluent { border-radius: 4px; background: #f7f7f8; }
    .mini-fluent .mini-bar, .mini-fluent .mini-button { background: #0f6cbd; }
    .mini-fluent .mini-line { background: #4c4c4c; }
    .mini-brutal { border: 3px solid #000; border-radius: 0; background: #fffdf5; box-shadow: 5px 5px 0 #000; }
    .mini-brutal .mini-bar { background: #ff6b6b; }
    .mini-brutal .mini-button { border: 2px solid #000; background: #ffd23f; box-shadow: 3px 3px 0 #000; }
    .mini-brutal .mini-line { background: #000; }
    .preview-layout { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 18px; align-items: start; }
    .preview { min-height: 260px; border: 1px solid rgba(65,75,90,.15); border-radius: 16px; padding: 18px; background: #f8fafc; }
    .preview h3 { margin: 0 0 9px; font-size: 18px; }
    .preview p { margin: 0 0 18px; color: #687386; line-height: 1.5; }
    .preview .fake-card { border: 1px solid rgba(65,75,90,.15); border-radius: 12px; padding: 16px; background: white; box-shadow: 0 7px 18px rgba(30,40,55,.10); }
    .preview .fake-card strong { display: block; margin-bottom: 8px; }
    .preview .fake-card span { display: block; width: 70%; height: 8px; margin: 7px 0; border-radius: 4px; background: #c8d0dc; }
    .preview-controls { display: grid; gap: 12px; }
    .preview-controls label { color: #586274; font-size: 12px; font-weight: 700; }
    .preview-controls select { width: 100%; margin-top: 5px; border: 1px solid rgba(65,75,90,.2); border-radius: 8px; padding: 9px; background: white; }
    .saved { margin-top: 18px; color: #477158; font-size: 12px; }
    .switcher { position: fixed; right: 50%; bottom: 18px; display: flex; align-items: center; gap: 12px; transform: translateX(50%); border: 1px solid rgba(20,25,35,.18); border-radius: 999px; padding: 8px 12px; background: #1f2530; color: white; box-shadow: 0 10px 30px rgba(20,25,35,.28); }
    .switcher button { border: 0; border-radius: 50%; width: 26px; height: 26px; background: #3e4858; color: white; cursor: pointer; }
    .switcher span { min-width: 130px; text-align: center; font-size: 12px; }
    @media (max-width: 760px) { .window { padding: 18px 12px 100px; } .settings { grid-template-columns: 1fr; } .sidebar { min-height: auto; } .sidebar nav { display: flex; gap: 6px; overflow-x: auto; } .nav-item { width: auto; white-space: nowrap; } .theme-grid, .preview-layout { grid-template-columns: 1fr; } .preview-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <div class="window">
    <div class="settings">
      <aside class="sidebar">
        <div class="brand">MEMORILO SETTINGS</div>
        <nav aria-label="Settings categories"><button class="nav-item active">General</button><button class="nav-item">Notes &amp; Editor</button><button class="nav-item">Reading</button><button class="nav-item">Sync</button></nav>
      </aside>
      <main class="panel" id="app"></main>
    </div>
  </div>
  <div class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><span id="variant-label"></span><button id="next" aria-label="Next variant">→</button></div>
  <script>
    const variants = ['A', 'B', 'C'];
    const names = { A: 'A · compact settings rows', B: 'B · theme card gallery', C: 'C · live preview split' };
    const familyData = [
      ['liquid-glass', 'Liquid Glass', 'Translucent, calm, platform-aware', 'mini-liquid'],
      ['fluent', 'Fluent UI', 'Focused, systematic, cross-platform', 'mini-fluent'],
      ['neubrutalism', 'Neubrutalism', 'Bold structure, hard edges, high contrast', 'mini-brutal'],
    ];
    let variant = new URLSearchParams(location.search).get('variant') || 'A';
    if (!variants.includes(variant)) variant = 'A';
    let family = 'liquid-glass';
    let appearance = 'system';
    const app = document.querySelector('#app');
    const label = document.querySelector('#variant-label');
    const button = (value, text, group) => `<button type="button" data-value="${value}" data-group="${group}" aria-checked="${value === (group === 'family' ? family : appearance)}">${text}</button>`;
    const familyCard = ([value, title, description, cls]) => `<button class="theme-card" type="button" data-value="${value}" data-group="family" aria-checked="${value === family}"><div class="mini ${cls}"><div class="mini-bar"></div><div class="mini-line"></div><div class="mini-line"></div><div class="mini-button"></div></div><h3>${title}</h3><p>${description}</p></button>`;
    function heading() { return `<p class="eyebrow">General</p><h1>Theme</h1><p class="intro">Choose the visual language and appearance that make Memorilo feel right for your work. Changes apply immediately across open windows.</p>`; }
    function renderA() { app.innerHTML = `${heading()}<section class="section"><h2>Visual language</h2><div class="row"><div><strong>Theme family</strong><small>Choose the interface personality.</small></div><div class="segmented" role="radiogroup" aria-label="Theme family">${familyData.map(([v,t]) => button(v,t,'family')).join('')}</div></div><div class="row"><div><strong>Appearance</strong><small>System follows your operating system.</small></div><div class="segmented" role="radiogroup" aria-label="Appearance">${['system','light','dark'].map(v => button(v,v[0].toUpperCase()+v.slice(1),'appearance')).join('')}</div></div></section><p class="saved">Saved automatically · ${family} · ${appearance}</p>`; }
    function renderB() { app.innerHTML = `${heading()}<section class="section"><h2>Theme family</h2><div class="theme-grid" role="radiogroup" aria-label="Theme family">${familyData.map(familyCard).join('')}</div></section><section class="section"><h2>Appearance</h2><div class="segmented" role="radiogroup" aria-label="Appearance">${['system','light','dark'].map(v => button(v,v[0].toUpperCase()+v.slice(1),'appearance')).join('')}</div></section><p class="saved">Saved automatically · Preview cards reuse the same theme metadata as the runtime.</p>`; }
    function renderC() { app.innerHTML = `${heading()}<section class="section preview-layout"><div class="preview"><h3>${familyData.find(f => f[0] === family)[1]}</h3><p>${familyData.find(f => f[0] === family)[2]}</p><div class="fake-card"><strong>Theme preview</strong><span></span><span></span><span></span></div></div><div class="preview-controls"><label>Theme family<select data-select="family">${familyData.map(([v,t]) => `<option value="${v}" ${v === family ? 'selected' : ''}>${t}</option>`).join('')}</select></label><label>Appearance<select data-select="appearance">${['system','light','dark'].map(v => `<option value="${v}" ${v === appearance ? 'selected' : ''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></label></div></section><p class="saved">Saved automatically · The preview changes with the live selection.</p>`; }
    function render() { ({ A: renderA, B: renderB, C: renderC }[variant])(); label.textContent = names[variant]; app.querySelectorAll('[data-group]').forEach(el => el.addEventListener('click', () => { if (el.dataset.group === 'family') family = el.dataset.value; else appearance = el.dataset.value; render(); })); app.querySelectorAll('[data-select]').forEach(el => el.addEventListener('change', () => { if (el.dataset.select === 'family') family = el.value; else appearance = el.value; render(); })); }
    function setVariant(next) { variant = variants[(variants.indexOf(variant) + next + variants.length) % variants.length]; const url = new URL(location.href); url.searchParams.set('variant', variant); history.replaceState(null, '', url); render(); }
    document.querySelector('#previous').addEventListener('click', () => setVariant(-1)); document.querySelector('#next').addEventListener('click', () => setVariant(1)); document.addEventListener('keydown', event => { if (event.target.matches('input, textarea, select, [contenteditable]')) return; if (event.key === 'ArrowLeft') setVariant(-1); if (event.key === 'ArrowRight') setVariant(1); }); render();
  </script>
</body>
</html>
