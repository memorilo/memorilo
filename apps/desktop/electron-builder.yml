appId: dev.memorilo.desktop
productName: Memorilo
executableName: memorilo

directories:
  output: dist

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../../.cache/embedding-models
    to: embedding-models

asar: true
asarUnpack:
  - node_modules/@huggingface/transformers/**
  - node_modules/@img/**
  - node_modules/better-sqlite3/**
  - node_modules/loro-crdt/**
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/sqlite-vec*/**

npmRebuild: false
nativeRebuilder: sequential

win:
  target:
    - nsis
