[package]
name = "tauri-plugin-android-statusbar"
version = "0.1.0"
description = "Android status bar control for Tauri."
edition = "2021"
authors = [ "memorilo" ]
license = "Apache-2.0 OR MIT"
rust-version = "1.77.2"
links = "tauri-plugin-android-statusbar"
build = "build.rs"

[lib]
name = "tauri_plugin_android_statusbar"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = [ "derive" ] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5", features = [ "build" ] }
