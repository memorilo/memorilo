name: Sync Server Image

on:
  push:
    tags:
      - '*'

concurrency:
  group: sync-server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    name: Test and publish Sync Server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "Tag '$TAG' is not SemVer; skipping Sync Server image publication."
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${TAG#v}"
          # Docker tags cannot contain SemVer build-metadata '+'.
          docker_version="${version//+/-}"
          version_without_build="${version%%+*}"
          if [[ "$version_without_build" != *-* ]]; then
            stable=true
          else
            stable=false
          fi
          {
            echo 'valid=true'
            echo "version=$version"
            echo "docker_version=$docker_version"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.tag.outputs.valid == 'true'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: steps.tag.outputs.valid == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Set up Node.js
        if: steps.tag.outputs.valid == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.tag.outputs.valid == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run sync package and server tests
        if: steps.tag.outputs.valid == 'true'
        run: |
          pnpm --filter @memorilo/sync exec vitest run --passWithNoTests --testTimeout=15000
          pnpm --filter @memorilo/sync-server test

      - name: Set up Docker Buildx
        if: steps.tag.outputs.valid == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.valid == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.tag.outputs.valid == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/memorilo-sync-server
          tags: |
            type=raw,value=${{ steps.tag.outputs.docker_version }}
            type=raw,value=v${{ steps.tag.outputs.docker_version }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.stable == 'true' }}

      - name: Build and publish Sync Server image
        if: steps.tag.outputs.valid == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sync-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sync-server
          cache-to: type=gha,mode=max,scope=sync-server
