name: Build on PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/build') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    outputs:
      build_windows: ${{ steps.check.outputs.build_windows }}
      build_macos: ${{ steps.check.outputs.build_macos }}
      build_ubuntu: ${{ steps.check.outputs.build_ubuntu }}
      build_android: ${{ steps.check.outputs.build_android }}
      build_ios: ${{ steps.check.outputs.build_ios }}
      head_ref: ${{ steps.get-ref.outputs.head_ref }}
      arch_filter: ${{ steps.check.outputs.arch_filter }}
      arch_filter_set: ${{ steps.check.outputs.arch_filter_set }}
    steps:
      - name: Get PR Branch
        id: get-ref
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);

      - name: Check Command
        id: check
        run: |
          BODY="${{ github.event.comment.body }}"
          echo "Comment body: $BODY"

          # Extract architecture tokens from comment body
          ARCH_TOKENS=""
          ARCH_FILTER_SET="false"

          # Scan for arch tokens and normalize to canonical forms
          if [[ " $BODY " =~ [[:space:]]x64[[:space:]] ]] || [[ " $BODY " =~ [[:space:]]amd64[[:space:]] ]] || [[ " $BODY " =~ [[:space:]]x86_64[[:space:]] ]]; then
            ARCH_TOKENS="${ARCH_TOKENS}x86_64 "
            ARCH_FILTER_SET="true"
          fi

          if [[ " $BODY " =~ [[:space:]]arm64[[:space:]] ]] || [[ " $BODY " =~ [[:space:]]aarch64[[:space:]] ]] || [[ " $BODY " =~ [[:space:]]aarch[[:space:]] ]]; then
            ARCH_TOKENS="${ARCH_TOKENS}aarch64 "
            ARCH_FILTER_SET="true"
          fi

          if [[ " $BODY " =~ [[:space:]]armv7[[:space:]] ]]; then
            ARCH_TOKENS="${ARCH_TOKENS}armv7 "
            ARCH_FILTER_SET="true"
          fi

          # Deduplicate and sort arch tokens
          if [ "$ARCH_FILTER_SET" = "true" ]; then
            ARCH_FILTER=$(echo "$ARCH_TOKENS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
            echo "arch_filter=$ARCH_FILTER" >> $GITHUB_OUTPUT
            echo "arch_filter_set=true" >> $GITHUB_OUTPUT
            echo "Architecture filter detected: $ARCH_FILTER"
          else
            echo "arch_filter=" >> $GITHUB_OUTPUT
            echo "arch_filter_set=false" >> $GITHUB_OUTPUT
          fi

          # Check for platform targets
          if [[ "$BODY" == *"/build all"* ]]; then
            echo "build_windows=true" >> $GITHUB_OUTPUT
            echo "build_macos=true" >> $GITHUB_OUTPUT
            echo "build_ubuntu=true" >> $GITHUB_OUTPUT
            echo "build_android=true" >> $GITHUB_OUTPUT
            echo "build_ios=true" >> $GITHUB_OUTPUT
          else
            if [[ "$BODY" == *"/build windows"* ]]; then echo "build_windows=true" >> $GITHUB_OUTPUT; fi
            if [[ "$BODY" == *"/build macos"* ]]; then echo "build_macos=true" >> $GITHUB_OUTPUT; fi
            if [[ "$BODY" == *"/build ubuntu"* ]]; then echo "build_ubuntu=true" >> $GITHUB_OUTPUT; fi
            if [[ "$BODY" == *"/build android"* ]]; then echo "build_android=true" >> $GITHUB_OUTPUT; fi
            if [[ "$BODY" == *"/build ios"* ]]; then echo "build_ios=true" >> $GITHUB_OUTPUT; fi
          fi

      - name: Acknowledge
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

  build-linux-x86_64:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_ubuntu == 'true' && (needs.check-trigger.outputs.arch_filter_set != 'true' || contains(needs.check-trigger.outputs.arch_filter, 'x86_64'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev:armhf zlib1g-dev:armhf \
            libgtk-3-dev:armhf libwebkit2gtk-4.1-dev:armhf libjavascriptcoregtk-4.1-dev:armhf libsoup-3.0-dev:armhf \
            libglib2.0-dev:armhf libgdk-pixbuf-2.0-dev:armhf libpango1.0-dev:armhf libcairo2-dev:armhf \
            libatk1.0-dev:armhf libharfbuzz-dev:armhf libayatana-appindicator3-dev:armhf librsvg2-dev:armhf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install node dependencies
        run: pnpm install

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli -y

      - name: Download web resources
        run: just download-resource

      - name: Build Linux x86_64
        run: just build-desktop

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json 2>/dev/null || grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set architecture token
        run: |
          echo "ARCH_TOKEN=x86_64" >> $GITHUB_ENV

      - name: Rename and prepare artifacts
        run: |
          VERSION="${{ env.APP_VERSION }}"
          ARCH="${{ env.ARCH_TOKEN }}"
          
          # Process deb
          DEB_PATH=$(find src-tauri/target/release/bundle/deb -name "*.deb" -type f 2>/dev/null | head -n 1)
          if [ -n "$DEB_PATH" ] && [ -f "$DEB_PATH" ]; then
            DEB_NAME="memorilo-linux-${ARCH}-v${VERSION}.deb"
            cp "$DEB_PATH" "$DEB_NAME"
            echo "DEB_PATH=$DEB_NAME" >> $GITHUB_ENV
            echo "Created $DEB_NAME"
          fi
          
          # Process rpm
          RPM_PATH=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" -type f 2>/dev/null | head -n 1)
          if [ -n "$RPM_PATH" ] && [ -f "$RPM_PATH" ]; then
            RPM_NAME="memorilo-linux-${ARCH}-v${VERSION}.rpm"
            cp "$RPM_PATH" "$RPM_NAME"
            echo "RPM_PATH=$RPM_NAME" >> $GITHUB_ENV
            echo "Created $RPM_NAME"
          fi
          
          # Process AppImage
          APPIMAGE_PATH=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE_PATH" ] && [ -f "$APPIMAGE_PATH" ]; then
            APPIMAGE_NAME="memorilo-linux-${ARCH}-v${VERSION}.AppImage"
            cp "$APPIMAGE_PATH" "$APPIMAGE_NAME"
            echo "APPIMAGE_PATH=$APPIMAGE_NAME" >> $GITHUB_ENV
            echo "Created $APPIMAGE_NAME"
          fi

      - name: Upload deb artifact
        if: env.DEB_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-linux-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.deb
          path: ${{ env.DEB_PATH }}

      - name: Upload rpm artifact
        if: env.RPM_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-linux-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.rpm
          path: ${{ env.RPM_PATH }}

      - name: Upload AppImage artifact
        if: env.APPIMAGE_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-linux-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.AppImage
          path: ${{ env.APPIMAGE_PATH }}

  build-linux-aarch64:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_ubuntu == 'true' && (needs.check-trigger.outputs.arch_filter_set != 'true' || contains(needs.check-trigger.outputs.arch_filter, 'aarch64'))
    runs-on: ubuntu-24.04-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install node dependencies
        run: pnpm install

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli -y

      - name: Download web resources
        run: just download-resource

      - name: Build Linux aarch64
        run: just build-desktop

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json 2>/dev/null || grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set architecture token
        run: |
          echo "ARCH_TOKEN=aarch64" >> $GITHUB_ENV

      - name: Rename and prepare artifacts
        run: |
          VERSION="${{ env.APP_VERSION }}"
          ARCH="${{ env.ARCH_TOKEN }}"
          
          # Process deb
          DEB_PATH=$(find src-tauri/target/release/bundle/deb -name "*.deb" -type f 2>/dev/null | head -n 1)
          if [ -n "$DEB_PATH" ] && [ -f "$DEB_PATH" ]; then
            DEB_NAME="memorilo-linux-${ARCH}-v${VERSION}.deb"
            cp "$DEB_PATH" "$DEB_NAME"
            echo "DEB_PATH=$DEB_NAME" >> $GITHUB_ENV
            echo "Created $DEB_NAME"
          fi
          
          # Process rpm
          RPM_PATH=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" -type f 2>/dev/null | head -n 1)
          if [ -n "$RPM_PATH" ] && [ -f "$RPM_PATH" ]; then
            RPM_NAME="memorilo-linux-${ARCH}-v${VERSION}.rpm"
            cp "$RPM_PATH" "$RPM_NAME"
            echo "RPM_PATH=$RPM_NAME" >> $GITHUB_ENV
            echo "Created $RPM_NAME"
          fi
          
          # Process AppImage
          APPIMAGE_PATH=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f 2>/dev/null | head -n 1)
          if [ -n "$APPIMAGE_PATH" ] && [ -f "$APPIMAGE_PATH" ]; then
            APPIMAGE_NAME="memorilo-linux-${ARCH}-v${VERSION}.AppImage"
            cp "$APPIMAGE_PATH" "$APPIMAGE_NAME"
            echo "APPIMAGE_PATH=$APPIMAGE_NAME" >> $GITHUB_ENV
            echo "Created $APPIMAGE_NAME"
          fi

      - name: Upload deb artifact
        if: env.DEB_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-linux-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.deb
          path: ${{ env.DEB_PATH }}

      - name: Upload rpm artifact
        if: env.RPM_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-linux-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.rpm
          path: ${{ env.RPM_PATH }}

      - name: Upload AppImage artifact
        if: env.APPIMAGE_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-linux-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.AppImage
          path: ${{ env.APPIMAGE_PATH }}

  build-linux-armv7:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_ubuntu == 'true' && (needs.check-trigger.outputs.arch_filter_set != 'true' || contains(needs.check-trigger.outputs.arch_filter, 'armv7'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install node dependencies
        run: pnpm install

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install cross-compilation tools
        run: |
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-armv7-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-armv7-cargo-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli -y

      - name: Download model resources
        run: just download-model

      - name: Download web resources
        run: just download-resource

      - name: Build Linux armv7 (deb and rpm only)
        env:
          PKG_CONFIG_SYSROOT_DIR: /
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          cargo tauri build --target armv7-unknown-linux-gnueabihf --bundles deb,rpm

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json 2>/dev/null || grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set architecture token
        run: |
          echo "ARCH_TOKEN=armv7" >> $GITHUB_ENV

      - name: Rename and prepare artifacts
        run: |
          VERSION="${{ env.APP_VERSION }}"
          ARCH="${{ env.ARCH_TOKEN }}"
          
          # Process deb
          DEB_PATH=$(find src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/deb -name "*.deb" -type f 2>/dev/null | head -n 1)
          if [ -n "$DEB_PATH" ] && [ -f "$DEB_PATH" ]; then
            DEB_NAME="memorilo-linux-${ARCH}-v${VERSION}.deb"
            cp "$DEB_PATH" "$DEB_NAME"
            echo "DEB_PATH=$DEB_NAME" >> $GITHUB_ENV
            echo "Created $DEB_NAME"
          fi
          
          # Process rpm
          RPM_PATH=$(find src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/rpm -name "*.rpm" -type f 2>/dev/null | head -n 1)
          if [ -n "$RPM_PATH" ] && [ -f "$RPM_PATH" ]; then
            RPM_NAME="memorilo-linux-${ARCH}-v${VERSION}.rpm"
            cp "$RPM_PATH" "$RPM_NAME"
            echo "RPM_PATH=$RPM_NAME" >> $GITHUB_ENV
            echo "Created $RPM_NAME"
          fi

      - name: Upload deb artifact
        if: env.DEB_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-linux-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.deb
          path: ${{ env.DEB_PATH }}

      - name: Upload rpm artifact
        if: env.RPM_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-linux-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.rpm
          path: ${{ env.RPM_PATH }}

  build-macos:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Check runner architecture
        id: runner-arch
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            arm64) CANONICAL="aarch64" ;;
            x86_64) CANONICAL="x86_64" ;;
            *) CANONICAL="$ARCH" ;;
          esac
          echo "arch=$CANONICAL" >> $GITHUB_OUTPUT
          
          # Check if we should skip based on arch filter
          ARCH_FILTER="${{ needs.check-trigger.outputs.arch_filter }}"
          ARCH_FILTER_SET="${{ needs.check-trigger.outputs.arch_filter_set }}"
          
          if [ "$ARCH_FILTER_SET" = "true" ]; then
            if [[ ! " $ARCH_FILTER " =~ " $CANONICAL " ]]; then
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Nix
        if: steps.runner-arch.outputs.skip != 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        if: steps.runner-arch.outputs.skip != 'true'
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Cargo
        if: steps.runner-arch.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache pnpm
        if: steps.runner-arch.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install just
        if: steps.runner-arch.outputs.skip != 'true'
        uses: taiki-e/install-action@just

      - name: Install node dependencies
        if: steps.runner-arch.outputs.skip != 'true'
        run: nix develop --command bash -c "pnpm install"

      - name: Download web resources
        if: steps.runner-arch.outputs.skip != 'true'
        run: just download-resource

      - name: Build MacOS
        if: steps.runner-arch.outputs.skip != 'true'
        run: just build-desktop

      - name: Get version
        if: steps.runner-arch.outputs.skip != 'true'
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json 2>/dev/null || grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Process macOS artifacts
        if: steps.runner-arch.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ steps.runner-arch.outputs.arch }}"
          
          # Find and zip .app
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            APP_NAME="memorilo-darwin-${ARCH}-v${VERSION}-app.zip"
            ditto -c -k --keepParent "$APP_PATH" "$APP_NAME"
            echo "Created $APP_NAME"
          fi
          
          # Find and rename .dmg
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | head -n 1)
          if [ -n "$DMG_PATH" ] && [ -f "$DMG_PATH" ]; then
            DMG_NAME="memorilo-darwin-${ARCH}-v${VERSION}.dmg"
            cp "$DMG_PATH" "$DMG_NAME"
            echo "Created $DMG_NAME"
          fi

      - name: Upload .app artifact
        if: steps.runner-arch.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-darwin-${{ steps.runner-arch.outputs.arch }}-v${{ steps.version.outputs.version }}-app.zip
          path: memorilo-darwin-${{ steps.runner-arch.outputs.arch }}-v${{ steps.version.outputs.version }}-app.zip
          if-no-files-found: warn

      - name: Upload .dmg artifact
        if: steps.runner-arch.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-darwin-${{ steps.runner-arch.outputs.arch }}-v${{ steps.version.outputs.version }}.dmg
          path: memorilo-darwin-${{ steps.runner-arch.outputs.arch }}-v${{ steps.version.outputs.version }}.dmg
          if-no-files-found: warn

  build-windows-x86_64:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_windows == 'true' && (needs.check-trigger.outputs.arch_filter_set != 'true' || contains(needs.check-trigger.outputs.arch_filter, 'x86_64'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --no-confirm

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Install unzip
        run: choco install unzip -y

      - name: Download web resources
        run: just download-resource

      - name: Build Windows x86_64
        run: just build-desktop

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set architecture token
        shell: pwsh
        run: |
          echo "ARCH_TOKEN=x86_64" >> $env:GITHUB_ENV

      - name: Rename and prepare artifacts
        shell: pwsh
        run: |
          $VERSION = "${{ env.APP_VERSION }}"
          $ARCH = "${{ env.ARCH_TOKEN }}"
          
          # Process NSIS installer
          $nsisFile = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisFile) {
            $newName = "memorilo-win-${ARCH}-v${VERSION}.exe"
            Copy-Item -Path $nsisFile.FullName -Destination $newName
            echo "NSIS_PATH=$newName" >> $env:GITHUB_ENV
            Write-Host "Created $newName"
          }
          
          # Process MSI installer (optional)
          $msiFile = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msiFile) {
            $newName = "memorilo-win-${ARCH}-v${VERSION}.msi"
            Copy-Item -Path $msiFile.FullName -Destination $newName
            echo "MSI_PATH=$newName" >> $env:GITHUB_ENV
            Write-Host "Created $newName"
          }

      - name: Upload NSIS artifact
        if: env.NSIS_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-win-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.exe
          path: ${{ env.NSIS_PATH }}

      - name: Upload MSI artifact
        if: env.MSI_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-win-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.msi
          path: ${{ env.MSI_PATH }}

  build-windows-arm64:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_windows == 'true' && (needs.check-trigger.outputs.arch_filter_set != 'true' || contains(needs.check-trigger.outputs.arch_filter, 'aarch64'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Set up MSVC ARM64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Tauri CLI
        run: cargo binstall tauri-cli --no-confirm

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Install unzip
        run: choco install unzip -y

      - name: Download model resources
        run: just download-model

      - name: Download web resources
        run: just download-resource

      - name: Build Windows ARM64
        run: cargo tauri build --target aarch64-pc-windows-msvc

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set architecture token
        shell: pwsh
        run: |
          echo "ARCH_TOKEN=aarch64" >> $env:GITHUB_ENV

      - name: Rename and prepare artifacts
        shell: pwsh
        run: |
          $VERSION = "${{ env.APP_VERSION }}"
          $ARCH = "${{ env.ARCH_TOKEN }}"
          
          # Process NSIS installer
          $nsisFile = Get-ChildItem -Path "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisFile) {
            $newName = "memorilo-win-${ARCH}-v${VERSION}.exe"
            Copy-Item -Path $nsisFile.FullName -Destination $newName
            echo "NSIS_PATH=$newName" >> $env:GITHUB_ENV
            Write-Host "Created $newName"
          }
          
           # Process MSI installer (optional)
          $msiFile = Get-ChildItem -Path "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msiFile) {
            $newName = "memorilo-win-${ARCH}-v${VERSION}.msi"
            Copy-Item -Path $msiFile.FullName -Destination $newName
            echo "MSI_PATH=$newName" >> $env:GITHUB_ENV
            Write-Host "Created $newName"
          }

      - name: Upload NSIS artifact
        if: env.NSIS_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-win-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.exe
          path: ${{ env.NSIS_PATH }}

      - name: Upload MSI artifact
        if: env.MSI_PATH
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-win-${{ env.ARCH_TOKEN }}-v${{ env.APP_VERSION }}.msi
          path: ${{ env.MSI_PATH }}

  build-android:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install node dependencies
        run: nix develop ".#android" --command bash -c "pnpm install"

      - name: Download web resources
        run: just download-resource

      - name: Build Android
        run: just build-android

      - name: Get version and map arch filters
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json 2>/dev/null || grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Map arch filter to Android ABIs
          declare -A ABI_MAP=(
            [aarch64]="arm64-v8a"
            [armv7]="armeabi-v7a"
            [x86_64]="x86_64"
          )
          
          ARCH_FILTER="${{ needs.check-trigger.outputs.arch_filter }}"
          ARCH_FILTER_SET="${{ needs.check-trigger.outputs.arch_filter_set }}"
          
          FILTERED_ABIS=""
          if [ "$ARCH_FILTER_SET" = "true" ]; then
            for arch in $ARCH_FILTER; do
              if [ -n "${ABI_MAP[$arch]}" ]; then
                FILTERED_ABIS="${FILTERED_ABIS}${ABI_MAP[$arch]} "
              fi
            done
          fi
          
          echo "FILTERED_ABIS=$FILTERED_ABIS" >> $GITHUB_ENV
          echo "ARCH_FILTER_SET=$ARCH_FILTER_SET" >> $GITHUB_ENV

      - name: Rename and process APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p artifacts
          
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/release"
          
          # Map of ABI directory to ABI name
          declare -A ABI_NAMES=(
            [arm64-v8a]="arm64-v8a"
            [armeabi-v7a]="armeabi-v7a"
            [x86_64]="x86_64"
            [x86]="x86"
          )
          
          echo "Processing APKs with ARCH_FILTER_SET=$ARCH_FILTER_SET and FILTERED_ABIS=$FILTERED_ABIS"
          
          # Process universal APK (only if no arch filter)
          if [ "$ARCH_FILTER_SET" != "true" ]; then
            UNIVERSAL_APK="$APK_DIR/app-release.apk"
            if [ -f "$UNIVERSAL_APK" ]; then
              cp "$UNIVERSAL_APK" "artifacts/memorilo-android-universal-v${VERSION}.apk"
              echo "Created memorilo-android-universal-v${VERSION}.apk"
            fi
          fi
          
          # Process ABI-split APKs
          for abi_dir in "${!ABI_NAMES[@]}"; do
            abi_name="${ABI_NAMES[$abi_dir]}"
            abi_apk="$APK_DIR/$abi_dir/app-release.apk"
            
            if [ -f "$abi_apk" ]; then
              # Check if this ABI should be uploaded
              if [ "$ARCH_FILTER_SET" != "true" ] || [[ " $FILTERED_ABIS " =~ " $abi_name " ]]; then
                cp "$abi_apk" "artifacts/memorilo-android-${abi_name}-v${VERSION}.apk"
                echo "Created memorilo-android-${abi_name}-v${VERSION}.apk"
              fi
            fi
          done

      - name: Upload universal APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-android-universal-v${{ steps.version.outputs.version }}.apk
          path: artifacts/memorilo-android-universal-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: ignore
      
      - name: Upload arm64-v8a APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-android-arm64-v8a-v${{ steps.version.outputs.version }}.apk
          path: artifacts/memorilo-android-arm64-v8a-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: ignore
      
      - name: Upload armeabi-v7a APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-android-armeabi-v7a-v${{ steps.version.outputs.version }}.apk
          path: artifacts/memorilo-android-armeabi-v7a-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: ignore
      
      - name: Upload x86_64 APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-android-x86_64-v${{ steps.version.outputs.version }}.apk
          path: artifacts/memorilo-android-x86_64-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: ignore
      
      - name: Upload x86 APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-android-x86-v${{ steps.version.outputs.version }}.apk
          path: artifacts/memorilo-android-x86-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: ignore

  build-ios:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_ios == 'true' && (needs.check-trigger.outputs.arch_filter_set != 'true' || contains(needs.check-trigger.outputs.arch_filter, 'aarch64'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install node dependencies
        run: nix develop ".#ios" --command bash -c "pnpm install"

      - name: Download web resources
        run: just download-resource

      - name: Build iOS
        run: nix develop ".#ios" --command bash -c "just build-ios"

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json 2>/dev/null || grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Process iOS artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="aarch64"
          
          # Find simulator .app
          APP_PATH=$(find src-tauri/gen/apple/build/Build/Products -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            APP_NAME="memorilo-ios-${ARCH}-v${VERSION}-app.zip"
            ditto -c -k --keepParent "$APP_PATH" "$APP_NAME"
            echo "Created $APP_NAME"
          else
            echo "Warning: No .app bundle found"
          fi

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: memorilo-ios-aarch64-v${{ steps.version.outputs.version }}-app.zip
          path: memorilo-ios-aarch64-v${{ steps.version.outputs.version }}-app.zip
          if-no-files-found: warn

  report:
    needs: [check-trigger, build-linux-x86_64, build-linux-aarch64, build-linux-armv7, build-macos, build-windows-x86_64, build-windows-arm64, build-android, build-ios]
    if: always() && needs.check-trigger.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Generate Report
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId;
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`;

            const statuses = {
              'linux-x86_64': '${{ needs.build-linux-x86_64.result }}',
              'linux-aarch64': '${{ needs.build-linux-aarch64.result }}',
              'linux-armv7': '${{ needs.build-linux-armv7.result }}',
              macos: '${{ needs.build-macos.result }}',
              'windows-x86_64': '${{ needs.build-windows-x86_64.result }}',
              'windows-arm64': '${{ needs.build-windows-arm64.result }}',
              android: '${{ needs.build-android.result }}',
              ios: '${{ needs.build-ios.result }}'
            };

            let body = `### Build Result 🚀\n\n[View Workflow Run](${run_url})\n\n`;

            for (const [platform, status] of Object.entries(statuses)) {
              if (status === 'success') {
                body += `- ✅ **${platform}**: Build Success\n`;
              } else if (status === 'failure') {
                body += `- ❌ **${platform}**: Build Failed\n`;
              } else if (status === 'skipped') {
                body += `- ⏭️ **${platform}**: Skipped\n`;
              }
            }

            // Fetch artifacts
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run_id
            });

            body += `\n### Artifacts\n\n`;
            
            if (artifacts.data.artifacts.length === 0) {
              body += `No artifacts found.`;
            } else {
              for (const artifact of artifacts.data.artifacts) {
                if (!artifact.expired) {
                  const artifact_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}/artifacts/${artifact.id}`;
                  body += `- [${artifact.name}](${artifact_url})\n`;
                }
              }
              
              // Check if all artifacts are expired
              const unexpiredCount = artifacts.data.artifacts.filter(a => !a.expired).length;
              if (unexpiredCount === 0) {
                body += `All artifacts have expired.`;
              }
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
