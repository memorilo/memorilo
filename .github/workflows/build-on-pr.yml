name: Build on PR Comment

on:
  issue_comment:
    types: [created]

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/build')
    outputs:
      build_windows: ${{ steps.check.outputs.build_windows }}
      build_macos: ${{ steps.check.outputs.build_macos }}
      build_ubuntu: ${{ steps.check.outputs.build_ubuntu }}
      build_android: ${{ steps.check.outputs.build_android }}
      head_ref: ${{ steps.get-ref.outputs.head_ref }}
    steps:
      - name: Get PR Branch
        id: get-ref
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);

      - name: Check Command
        id: check
        run: |
          BODY="${{ github.event.comment.body }}"
          echo "Comment body: $BODY"

          if [[ "$BODY" == *"/build all"* ]]; then
            echo "build_windows=true" >> $GITHUB_OUTPUT
            echo "build_macos=true" >> $GITHUB_OUTPUT
            echo "build_ubuntu=true" >> $GITHUB_OUTPUT
            echo "build_android=true" >> $GITHUB_OUTPUT
          else
            if [[ "$BODY" == *"/build windows"* ]]; then echo "build_windows=true" >> $GITHUB_OUTPUT; fi
            if [[ "$BODY" == *"/build macos"* ]]; then echo "build_macos=true" >> $GITHUB_OUTPUT; fi
            if [[ "$BODY" == *"/build ubuntu"* ]]; then echo "build_ubuntu=true" >> $GITHUB_OUTPUT; fi
            if [[ "$BODY" == *"/build android"* ]]; then echo "build_android=true" >> $GITHUB_OUTPUT; fi
          fi

      - name: Acknowledge
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

  build-ubuntu:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_ubuntu == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build Ubuntu
        run: nix develop --command bash -c "pnpm install && cargo tauri build"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-bundle
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build MacOS
        run: nix develop --command bash -c "pnpm install && cargo tauri build"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  build-windows:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Windows
        run: cargo tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    needs: check-trigger
    if: needs.check-trigger.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.head_ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build Android
        run: |
          nix develop ".#android" --command bash -c "pnpm install && cargo tauri android build && cargo tauri android build --split-per-abi"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  report:
    needs: [check-trigger, build-ubuntu, build-macos, build-windows, build-android]
    if: always() && needs.check-trigger.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Generate Report
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId;
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`;

            const statuses = {
              ubuntu: '${{ needs.build-ubuntu.result }}',
              macos: '${{ needs.build-macos.result }}',
              windows: '${{ needs.build-windows.result }}',
              android: '${{ needs.build-android.result }}'
            };

            let body = `### Build Result 🚀\n\n[View Workflow Run](${run_url})\n\n`;

            for (const [platform, status] of Object.entries(statuses)) {
              if (status === 'success') {
                body += `- ✅ **${platform}**: Build Success\n`;
              } else if (status === 'failure') {
                body += `- ❌ **${platform}**: Build Failed\n`;
              }
            }

            body += `\nArtifacts should be available in the workflow run summary.`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
