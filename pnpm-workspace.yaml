packages:
  - apps/mobile
  - apps/desktop
  - apps/desktop/*
  - packages/excalidraw/*
  - packages/*

supportedArchitectures:
  os:
    - current
    - darwin
    - win32
  cpu:
    - current
    - arm64
    - x64
    - wasm32

ignoredBuiltDependencies:
  - better-sqlite3
onlyBuiltDependencies:
  - electron
  - esbuild
  - onnxruntime-node
  - sharp
patchedDependencies:
  loro-react-native@1.10.3: patches/loro-react-native@1.10.3.patch
